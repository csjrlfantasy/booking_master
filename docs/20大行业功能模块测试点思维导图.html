<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>软件测试面试 —— 20大行业·功能模块测试点·思维导图</title>
<style>
:root {
  --bg:#0f1119; --card:#161822; --border:#252836;
  --t1:#ff6b6b; --t2:#4ecdc4; --t3:#ffe66d; --t4:#a37eba; --t5:#6bc5ff; --t6:#ff9f43;
  --text:#d0d0d8; --sub:#8888a0; --root:#e94560;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;overflow-x:hidden}

/* header */
.header{text-align:center;padding:22px 16px 8px}
.header h1{font-size:1.8rem;background:linear-gradient(135deg,var(--root),#f0c040);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header p{color:var(--sub);font-size:.85rem;margin-top:4px}

/* nav bar */
.nav-bar{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:12px 16px 8px;position:sticky;top:0;z-index:10;background:rgba(15,17,25,.92);backdrop-filter:blur(8px)}
.nav-bar button{padding:6px 13px;border-radius:18px;border:1px solid var(--border);background:var(--card);color:var(--sub);font-size:.78rem;cursor:pointer;transition:all .2s;white-space:nowrap}
.nav-bar button:hover{border-color:var(--root);color:#fff}
.nav-bar button.active{background:var(--root);border-color:var(--root);color:#fff;font-weight:700;box-shadow:0 0 16px rgba(233,69,96,.35)}

/* pagination */
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;padding:6px 0}
.pagination button{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--sub);cursor:pointer;font-size:.8rem;transition:all .2s}
.pagination button.active{background:var(--root);border-color:var(--root);color:#fff}
.pagination button:hover:not(.active){border-color:var(--root)}
.pagination .arrow{font-size:1rem;border:none;background:transparent;color:var(--sub);cursor:pointer;padding:4px 8px}
.pagination .arrow:hover{color:#fff}
.pagination .arrow:disabled{opacity:.3;cursor:not-allowed}

/* page */
.page{display:none;padding:6px 24px 40px;animation:fadeIn .35s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* === MIND MAP === */
.mind-map{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:10px 0;min-width:fit-content}

/* ROOT NODE */
.root-node{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100px;min-height:140px;background:linear-gradient(135deg,var(--root),#c0392b);border-radius:16px;padding:16px 10px;text-align:center;color:#fff;font-weight:700;font-size:1rem;box-shadow:0 6px 30px rgba(233,69,96,.3);position:relative;z-index:2;writing-mode:vertical-rl;letter-spacing:3px}
.root-node .icon{font-size:1.6rem;writing-mode:horizontal-tb;margin-bottom:4px}

/* LEVELS CONTAINER */
.levels-container{flex:1;display:flex;flex-direction:column;gap:28px;padding-left:8px}

/* One module row */
.module-row{display:flex;align-items:flex-start;gap:0;position:relative}
.module-row::before{content:'';position:absolute;left:-8px;top:18px;width:16px;height:2px;background:var(--border);border-radius:2px}

/* MODULE NODE (L1) */
.mod-node{flex-shrink:0;width:90px;min-height:50px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:10px;padding:8px 6px;font-weight:700;font-size:.8rem;color:#fff;position:relative;z-index:1}
.mod-node.m1{background:var(--t1)} .mod-node.m2{background:var(--t2)} .mod-node.m3{background:var(--t3);color:#1a1a2e} .mod-node.m4{background:var(--t4)} .mod-node.m5{background:var(--t5)} .mod-node.m6{background:var(--t6)}

/* Category group */
.cat-group{display:flex;flex-direction:column;gap:4px;padding-left:14px;position:relative;flex:1}
.cat-group::before{content:'';position:absolute;left:0;top:10px;width:14px;height:2px;background:var(--border);border-radius:2px}

.cat-row{display:flex;align-items:flex-start;gap:0;position:relative;flex-wrap:wrap}
.cat-row::before{content:'';position:absolute;left:-14px;top:9px;width:14px;height:2px;background:var(--border);border-radius:2px}

.cat-label{flex-shrink:0;font-size:.7rem;color:var(--sub);padding:4px 8px 4px 0;width:55px;text-align:right;font-weight:600;line-height:1.3}

.leaf-cluster{display:flex;flex-wrap:wrap;gap:3px 5px;padding:2px 0 2px 10px;position:relative}
.leaf-cluster::before{content:'';position:absolute;left:0;top:9px;width:10px;height:2px;background:var(--border);border-radius:2px}

.leaf{font-size:.7rem;color:#b0b0c0;padding:3px 8px;background:rgba(255,255,255,.03);border-radius:4px;white-space:nowrap;transition:all .2s;cursor:default;border:1px solid transparent}
.leaf:hover{color:#fff;background:rgba(255,255,255,.07);border-color:var(--border)}
.leaf.crit{color:#ff6b6b;font-weight:600;background:rgba(255,107,107,.08)}
.leaf.crit::before{content:'★ ';font-size:.6rem}

/* connecting vertical lines */
.module-row .vert-line{position:absolute;left:-8px;top:18px;bottom:0;width:2px;background:var(--border);border-radius:2px}

/* legend */
.legend{display:flex;justify-content:center;gap:16px;padding:12px;flex-wrap:wrap;font-size:.72rem;color:var(--sub)}
.legend span{display:flex;align-items:center;gap:5px}
.legend .dot{width:8px;height:8px;border-radius:50%}
.legend .crit-dot{width:8px;height:8px;border-radius:50%;background:#ff6b6b}

/* page info */
.page-info{text-align:center;padding:0 0 10px;font-size:.85rem;color:var(--sub)}
.page-info b{color:var(--root)}

/* responsive */
@media(max-width:768px){
  .mind-map{flex-direction:column;align-items:center}
  .root-node{writing-mode:horizontal-tb;width:auto;min-height:auto;padding:14px 24px;letter-spacing:1px}
  .module-row{flex-wrap:wrap}
  .mod-node{width:70px;font-size:.7rem}
}
@media print{
  body{background:#fff;color:#000}
  .page{display:block!important;page-break-after:always}
  .nav-bar,.pagination{display:none}
}
</style>
</head>
<body>

      ]},
      { name:'数据报表', cats:[
        {label:'报表',leaves:[{t:'曝光/点击/转化/ROI',crit:true},'实时/离线数据延迟','分维度下钻(地域/年龄/时段)','数据导出(Excel/CSV)']},
        {label:'归因',leaves:[{t:'点击归因vs曝光归因',crit:true},'归因窗口(7/14/30天)','多触点归因(U型/W型)','归因数据vs第三方差异<10%']}
      ]},
      { name:'素材管理', cats:[
        {label:'素材',leaves:[{t:'图片/视频/文案上传',crit:true},'素材审核(涉黄/违禁词)','尺寸自适应(不同广告位)','素材A/B测试']},
        {label:'落地页',leaves:[{t:'落地页加载速度<3s',crit:true},'落地页与广告素材一致','转化追踪埋点(表单/购买/下载)']}
      ]}
    ]
  }
];

// ==================== RENDER ====================
const PER_PAGE = 1; // one industry per page
let currentPage = 1;
const totalPages = industries.length;

function renderIndustry(data) {
  const cols = ['m1','m2','m3','m4','m5','m6'];
  return `
    <div class="mind-map">
      <div class="root-node">
        <span class="icon">${data.icon}</span>
        ${data.name}
      </div>
      <div class="levels-container">
        ${data.modules.map((mod, mi) => `
          <div class="module-row">
            <div class="mod-node ${cols[mi % cols.length]}">${mod.name}</div>
            <div class="cat-group">
              ${mod.cats.map((cat, ci) => `
                <div class="cat-row">
                  <div class="cat-label">${cat.label}</div>
                  <div class="leaf-cluster">
                    ${cat.leaves.map(l => {
                      const isCrit = typeof l === 'object' && l.crit;
                      const txt = typeof l === 'object' ? l.t : l;
                      return `<span class="leaf${isCrit ? ' crit' : ''}">${txt}</span>`;
                    }).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderPage(idx) {
  const data = industries[idx];
  return renderIndustry(data);
}

function init() {
  const container = document.getElementById('pagesContainer');
  let html = '';
  for (let i = 0; i < totalPages; i++) {
    html += `<div class="page${i === 0 ? ' active' : ''}" data-page="${i}">
      <div class="page-info">行业 <b>${i+1}</b> / ${totalPages} &nbsp;·&nbsp; ${industries[i].icon} ${industries[i].name}</div>
      ${renderPage(i)}
    </div>`;
  }
  container.innerHTML = html;

  // Nav bar
  const navBar = document.getElementById('navBar');
  navBar.innerHTML = industries.map((ind, i) =>
    `<button class="${i === 0 ? 'active' : ''}" onclick="goPage(${i})">${ind.icon} ${ind.name}</button>`
  ).join('');

  buildPagination();
}

function buildPagination() {
  const pg = document.getElementById('pagination');
  // Show pages in groups of 10
  const groupSize = 10;
  const groupStart = Math.floor(currentPage / groupSize) * groupSize;
  const groupEnd = Math.min(groupStart + groupSize, totalPages);

  let html = `<button class="arrow" onclick="goPage(${currentPage - 1})" ${currentPage === 0 ? 'disabled' : ''}>◀</button>`;

  if (groupStart > 0) {
    html += `<button onclick="goPage(0)">1</button><span style="color:var(--sub)">…</span>`;
  }

  for (let i = groupStart; i < groupEnd; i++) {
    html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i + 1}</button>`;
  }

  if (groupEnd < totalPages) {
    html += `<span style="color:var(--sub)">…</span><button onclick="goPage(${totalPages - 1})">${totalPages}</button>`;
  }

  html += `<button class="arrow" onclick="goPage(${currentPage + 1})" ${currentPage >= totalPages - 1 ? 'disabled' : ''}>▶</button>`;
  pg.innerHTML = html;
}

function goPage(p) {
  if (p < 0 || p >= totalPages) return;
  currentPage = p;

  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  const target = document.querySelector(`.page[data-page="${p}"]`);
  if (target) target.classList.add('active');

  // Update nav
  document.querySelectorAll('#navBar button').forEach((btn, i) => {
    btn.classList.toggle('active', i === p);
  });

  buildPagination();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') goPage(currentPage - 1);
  if (e.key === 'ArrowRight') goPage(currentPage + 1);
});

init();
</script>
