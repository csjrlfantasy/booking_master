<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>软件测试面试 —— 20大功能模块测试点思维导图</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card-bg: #16213e;
    --accent: #e94560;
    --gold: #f0c040;
    --text: #e0e0e0;
    --sub: #a0a0b8;
    --branch-1: #ff6b6b;
    --branch-2: #4ecdc4;
    --branch-3: #ffe66d;
    --branch-4: #a37eba;
    --branch-5: #6bc5ff;
    --branch-6: #ff9f43;
    --node-bg: #1e2a3a;
    --node-border: #2a3a4a;
    --tag-bg: rgba(233,69,96,0.15);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== HEADER ===== */
  .header {
    text-align: center;
    padding: 28px 20px 10px;
    background: linear-gradient(180deg, rgba(233,69,96,0.08) 0%, transparent 100%);
  }
  .header h1 {
    font-size: 2rem;
    background: linear-gradient(135deg, var(--accent), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  .header .subtitle {
    color: var(--sub);
    font-size: 0.92rem;
  }

  /* ===== PAGINATION TOP ===== */
  .pagination-top {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    padding: 16px 0 6px;
    flex-wrap: wrap;
  }
  .pagination-top button {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 2px solid var(--node-border);
    background: var(--card-bg);
    color: var(--sub);
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.25s;
  }
  .pagination-top button:hover { border-color: var(--accent); color: #fff; }
  .pagination-top button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 18px rgba(233,69,96,0.4);
  }
  .pagination-top .nav-arrow {
    font-size: 1.1rem;
    border: none;
    background: transparent;
    color: var(--sub);
    cursor: pointer;
    padding: 4px 8px;
  }
  .pagination-top .nav-arrow:hover { color: #fff; }

  /* ===== PAGE CONTAINER ===== */
  .pages-wrapper { position: relative; min-height: 700px; }
  .page {
    display: none;
    padding: 10px 24px 40px;
    animation: fadeSlideIn 0.4s ease;
  }
  .page.active { display: block; }
  @keyframes fadeSlideIn {
    from { opacity:0; transform:translateY(14px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .page-title {
    text-align: center;
    font-size: 1.15rem;
    color: var(--sub);
    margin-bottom: 22px;
    letter-spacing: 2px;
  }
  .page-title span {
    color: var(--accent);
    font-weight: 700;
    font-size: 1.4rem;
  }

  /* ===== MIND MAP LAYOUT ===== */
  .mind-map-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
    gap: 18px;
  }

  .mind-node {
    background: var(--card-bg);
    border: 1px solid var(--node-border);
    border-radius: 14px;
    overflow: hidden;
    transition: all 0.3s;
    position: relative;
  }
  .mind-node:hover {
    border-color: var(--accent);
    box-shadow: 0 8px 30px rgba(233,69,96,0.12);
    transform: translateY(-2px);
  }

  /* Root node */
  .root-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    font-weight: 700;
    font-size: 1.05rem;
    cursor: pointer;
    border-bottom: 1px solid var(--node-border);
    position: relative;
  }
  .root-bar .icon-circle {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    flex-shrink: 0;
    color: #fff;
  }
  .root-bar .tag {
    font-size: 0.7rem;
    padding: 2px 10px;
    border-radius: 20px;
    background: var(--tag-bg);
    color: var(--accent);
    margin-left: auto;
    white-space: nowrap;
  }

  /* Branches */
  .branches { padding: 8px 12px 14px; }
  .branch {
    margin: 2px 0;
    border-left: 2px solid transparent;
    padding-left: 12px;
    transition: border-color 0.3s;
  }
  .branch:hover { border-left-color: var(--accent); }
  .branch-title {
    font-weight: 600;
    font-size: 0.88rem;
    padding: 6px 0 3px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .branch-title .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .leaf-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 6px;
    padding: 2px 0 2px 14px;
  }
  .leaf {
    font-size: 0.78rem;
    color: var(--sub);
    padding: 2px 8px;
    background: rgba(255,255,255,0.03);
    border-radius: 4px;
    white-space: nowrap;
    transition: all 0.2s;
    cursor: default;
  }
  .leaf:hover {
    color: #fff;
    background: rgba(255,255,255,0.08);
  }
  .leaf.p0 { color: #ff6b6b; font-weight: 600; }
  .leaf.p0::before { content: '★ '; }

  /* Branch color themes */
  .c1 .root-bar .icon-circle { background: var(--branch-1); }
  .c1 .dot { background: var(--branch-1); }
  .c1 .root-bar { border-left: 4px solid var(--branch-1); }

  .c2 .root-bar .icon-circle { background: var(--branch-2); }
  .c2 .dot { background: var(--branch-2); }
  .c2 .root-bar { border-left: 4px solid var(--branch-2); }

  .c3 .root-bar .icon-circle { background: var(--branch-3); }
  .c3 .dot { background: var(--branch-3); color:#1a1a2e; }
  .c3 .root-bar { border-left: 4px solid var(--branch-3); }

  .c4 .root-bar .icon-circle { background: var(--branch-4); }
  .c4 .dot { background: var(--branch-4); }
  .c4 .root-bar { border-left: 4px solid var(--branch-4); }

  .c5 .root-bar .icon-circle { background: var(--branch-5); }
  .c5 .dot { background: var(--branch-5); }
  .c5 .root-bar { border-left: 4px solid var(--branch-5); }

  .c6 .root-bar .icon-circle { background: var(--branch-6); }
  .c6 .dot { background: var(--branch-6); }
  .c6 .root-bar { border-left: 4px solid var(--branch-6); }

  /* ===== BOTTOM PAGINATION ===== */
  .pagination-bottom {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 30px 0 50px;
  }
  .pagination-bottom button {
    padding: 10px 20px;
    border-radius: 24px;
    border: 1px solid var(--node-border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.25s;
  }
  .pagination-bottom button:hover {
    border-color: var(--accent);
    background: rgba(233,69,96,0.08);
  }
  .pagination-bottom button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .page-indicator {
    color: var(--sub);
    font-size: 0.9rem;
    letter-spacing: 2px;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 800px) {
    .mind-map-grid { grid-template-columns: 1fr; }
    .header h1 { font-size: 1.4rem; }
    .leaf { font-size: 0.72rem; }
  }

  /* ===== PRINT ===== */
  @media print {
    body { background: #fff; color: #111; }
    .mind-node { border: 1px solid #ccc; break-inside: avoid; background: #fafafa; }
    .pagination-top, .pagination-bottom { display: none; }
    .page { display: block !important; page-break-after: always; }
  }

  /* ===== TOOLTIP ===== */
  .tooltip-trigger { cursor: help; border-bottom: 1px dashed var(--sub); }
</style>
</head>
<body>

<div class="header">
  <h1>🧠 软件测试面试高频 20 大功能模块</h1>
  <p class="subtitle">测试点思维导图 · 分页浏览 · 面试速记版 &nbsp;|&nbsp; 共 4 页 · 每页 5 个模块</p>
</div>

<!-- Top pagination -->
<div class="pagination-top" id="paginationTop"></div>

<div class="pages-wrapper" id="pagesWrapper">

</div>

<!-- Bottom pagination -->
<div class="pagination-bottom" id="paginationBottom"></div>

// ==================== PAGINATION ====================
const PER_PAGE = 5;
const totalPages = Math.ceil(modules.length / PER_PAGE);
let currentPage = 1;

function getModulesForPage(page) {
  const start = (page - 1) * PER_PAGE;
  return modules.slice(start, start + PER_PAGE);
}

// ==================== RENDER MIND NODE ====================
function renderMindNode(mod) {
  const hasP0 = mod.branches.some(b => b.leaves.some(l => l.p0));
  const p0Badge = hasP0 ? `<span class="tag">★ 含P0必测</span>` : '';
  return `
    <div class="mind-node ${mod.color}">
      <div class="root-bar">
        <div class="icon-circle">${mod.icon}</div>
        <div>
          <div style="font-weight:700;">${mod.title}</div>
          <div style="font-size:0.7rem;color:var(--sub);">${mod.tag}</div>
        </div>
        ${p0Badge}
      </div>
      <div class="branches">
        ${mod.branches.map((b,i) => `
          <div class="branch">
            <div class="branch-title">
              <span class="dot"></span>${b.name}
            </div>
            <div class="leaf-list">
              ${b.leaves.map(l => `
                <span class="leaf${l.p0 ? ' p0' : ''}" title="${l.p0 ? 'P0核心测试点' : ''}">${l.t}</span>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// ==================== RENDER PAGE ====================
function renderPage(pageNum) {
  const mods = getModulesForPage(pageNum);
  return `
    <div class="page-title">第 <span>${pageNum}</span> / ${totalPages} 页 &nbsp;·&nbsp; 模块 ${(pageNum-1)*PER_PAGE+1} — ${Math.min(pageNum*PER_PAGE, modules.length)}</div>
    <div class="mind-map-grid">
      ${mods.map(m => renderMindNode(m)).join('')}
    </div>
  `;
}

// ==================== INIT ====================
function init() {
  const wrapper = document.getElementById('pagesWrapper');
  let pagesHTML = '';
  for (let p = 1; p <= totalPages; p++) {
    pagesHTML += `<div class="page${p === 1 ? ' active' : ''}" data-page="${p}">${renderPage(p)}</div>`;
  }
  wrapper.innerHTML = pagesHTML;

  buildPagination('paginationTop');
  buildPagination('paginationBottom');
  updatePaginationUI();
}

function buildPagination(containerId) {
  const container = document.getElementById(containerId);
  let html = `<button class="nav-arrow" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} title="上一页">◀</button>`;
  for (let p = 1; p <= totalPages; p++) {
    html += `<button class="page-btn${p === currentPage ? ' active' : ''}" onclick="goPage(${p})">${p}</button>`;
  }
  html += `<button class="nav-arrow" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} title="下一页">▶</button>`;
  container.innerHTML = html;
}

function updatePaginationUI() {
  ['paginationTop', 'paginationBottom'].forEach(id => buildPagination(id));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const activePage = document.querySelector(`.page[data-page="${currentPage}"]`);
  if (activePage) activePage.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goPage(p) {
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  updatePaginationUI();
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') goPage(currentPage - 1);
  if (e.key === 'ArrowRight') goPage(currentPage + 1);
});

// ==================== START ====================
init();
