# 数据库配置说明
# 请根据实际环境修改以下配置

# ==================== 开发环境 ====================
# MySQL 8.0
# 地址: localhost:3306
# 数据库: booking_db
# 用户名: root
# 密码: root (开发环境)

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/booking_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

