# Booking API 配置文件示例
# 复制此文件为 config.properties 并填写实际值，不要提交到版本控制

# JWT配置 - 必须设置，不能为空！
# 建议使用至少32位的随机字符串
jwt.secret=your-very-secure-jwt-secret-key-at-least-32-chars

# 数据库配置
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ticket_booking?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your-database-password

# Redis配置
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=your-redis-password

# 支付回调密钥
payment.callback.secret-key=your-payment-callback-secret-key