# 开发环境配置
spring:
  config:
    import: optional:classpath:application.yml

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ticket_booking?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: heihe123456
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000

  # Redis配置
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

# JWT配置
# 重要：生产环境必须设置环境变量 JWT_SECRET，不能使用默认值！
jwt:
  secret: ${JWT_SECRET:ticket_app_jwt_secret_key_2026_at_least_32_characters}
  expiration: 86400000  # 24小时
  header: Authorization
  prefix: Bearer

# 支付配置
payment:
  callback:
    secret-key: ${PAYMENT_CALLBACK_SECRET_KEY:ticket_app_payment_dev_key_2026_at_least_32_chars}

# Swagger配置
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

# 日志级别
logging:
  level:
    com.ticket.app: DEBUG
