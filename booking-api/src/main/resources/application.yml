# Spring Boot Configuration
spring:
  application:
    name: booking-api

  # 环境配置 (dev/test/prod)
  profiles:
    active: dev

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

  # HTTP编码配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# Server Configuration
server:
  port: 8088
  servlet:
    context-path: /api
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 200
      min-spare: 10

# MyBatis Plus Configuration
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ticket.app.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# JWT配置说明
# 重要：必须通过环境变量设置，不能使用默认值！
# - jwt.secret: JWT签名密钥（必填，建议至少32位字符）
# - jwt.expiration: Token过期时间（毫秒），默认86400000（24小时）
# 设置方式：
#   方式1: 环境变量 export JWT_SECRET=your-secret-key-at-least-32-chars
#   方式2: spring.config.import=file:./config.properties

# Logging Configuration
logging:
  level:
    root: INFO
    com.ticket.app: DEBUG
    com.ticket.app.repository: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/booking-api.log
    max-size: 100MB
    max-history: 30

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
