[pytest]
# 测试发现
testpaths = api-tests/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记定义
markers =
    smoke: 冒烟测试
    user: 用户模块测试
    ticket: 票务模块测试
    order: 订单模块测试
    cart: 购物车模块测试
    coupon: 优惠券模块测试
    regression: 回归测试

# 输出配置
addopts =
    -v
    --tb=short
    --strict-markers
    --html=report/test_report.html
    --self-contained-html
    --alluredir=report/allure-results

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 断言风格
filterwarnings =
    ignore::DeprecationWarning